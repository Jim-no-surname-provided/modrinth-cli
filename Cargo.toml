[package]
name = "modrinth-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.0", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.0", features = ["crossterm_0_29"] }
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha1 = "0.11.0"
strsim = "0.11.1"
urlencoding = "2.1.3"

[dev-dependencies]
httpmock = "0.8.3"
tempfile = "3.27.0"

[[bin]]
name = "mod"
path = "src/main.rs"
